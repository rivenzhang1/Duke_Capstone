[project]
name = "deeppace"
version = "0.1.0"
description = "DeepPace: Deep Learning for 2D Hotel Booking-Pace Forecasting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
]

# Heavy / optional deps stay out of the base install so that generating the
# Phase I dataset never pulls torch. See CLAUDE.md, "Modular design".
[project.optional-dependencies]
net = [
    "chronos-forecasting>=2.0,<3",
    "torch>=2.4",
]
eval = [
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "psutil>=6.0",
]
viz = [
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deeppace_sim", "src/deeppace_net", "src/deeppace_eval"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

# Pin platform-sensitive wheels here (e.g. a CUDA torch index) so they cannot
# silently downgrade.
# [tool.uv.sources]
# torch = { index = "pytorch-cu124" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
