name: File Request
description: Request, upload, locate, or review a project file
title: "[File]: "
labels:
  - files
body:
  - type: dropdown
    id: file_type
    attributes:
      label: File type
      options:
        - Presentation
        - Paper
        - Video
        - Image
        - Dataset
        - Other
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Request
      description: What file is needed, where is it, or what should be reviewed?
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link or location

