name: Task
description: Track project work
title: "[Task]: "
labels:
  - task
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should be true when this task is complete?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Relevant notes, links, files, or decisions.
  - type: textarea
    id: checklist
    attributes:
      label: Checklist
      value: "- [ ] "
  - type: input
    id: owner
    attributes:
      label: Owner
      placeholder: "@username"
  - type: input
    id: due
    attributes:
      label: Due date
      placeholder: "YYYY-MM-DD"

